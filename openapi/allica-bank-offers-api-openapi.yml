openapi: 3.2.0
info:
  title: Account and Transaction API Specification Offers API
  description: '# AISP API Overview


    These APIs can be used to access account information for Allica Business Rewards accounts.'
  termsOfService: https://www.openbanking.org.uk/terms
  contact:
    name: Service Desk
    email: ServiceDesk@openbanking.org.uk
  license:
    name: open-licence
    url: https://www.openbanking.org.uk/open-licence
  version: 3.1.10
servers:
- url: /open-banking/v3.1/aisp
tags:
- name: Offers
paths:
  /accounts/{AccountId}/offers:
    get:
      tags:
      - Offers
      summary: Get Offers
      operationId: GetAccountsAccountIdOffers
      parameters:
      - name: AccountId
        in: path
        description: AccountId
        required: true
        schema:
          type: string
      - in: header
        name: x-fapi-auth-date
        required: false
        description: 'The time when the PSU last logged in with the TPP.

          All dates in the HTTP headers are represented as RFC 7231 Full Dates. An example is below:

          Sun, 10 Sep 2017 19:43:31 UTC'
        schema:
          type: string
          pattern: ^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4} \d{2}:\d{2}:\d{2} (GMT|UTC)$
      - in: header
        name: x-fapi-customer-ip-address
        required: false
        description: The PSU's IP address if the PSU is currently logged in with the TPP.
        schema:
          type: string
      - in: header
        name: x-fapi-interaction-id
        required: false
        description: An RFC4122 UID used as a correlation id.
        schema:
          type: string
      - in: header
        name: Authorization
        required: true
        description: An Authorisation Token as per https://tools.ietf.org/html/rfc6750
        schema:
          type: string
      - in: header
        name: x-customer-user-agent
        description: Indicates the user-agent that the PSU is using.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Offers Read
          headers:
            x-fapi-interaction-id:
              description: An RFC4122 UID used as a correlation id.
              required: true
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required:
                - Data
                properties:
                  Data:
                    type: object
                    properties:
                      Offer:
                        type: array
                        items:
                          type: object
                          required:
                          - AccountId
                          properties:
                            AccountId:
                              description: A unique and immutable identifier used to identify the account resource. This identifier has no meaning to the account owner.
                              type: string
                              minLength: 1
                              maxLength: 40
                            OfferId:
                              description: A unique and immutable identifier used to identify the offer resource. This identifier has no meaning to the account owner.
                              type: string
                              minLength: 1
                              maxLength: 40
                            OfferType:
                              description: Offer type, in a coded form.
                              type: string
                              enum:
                              - BalanceTransfer
                              - LimitIncrease
                              - MoneyTransfer
                              - Other
                              - PromotionalRate
                            Description:
                              description: Further details of the offer.
                              type: string
                              minLength: 1
                              maxLength: 500
                            StartDateTime:
                              description: 'Date and time at which the offer starts.All dates in the JSON payloads are represented in ISO 8601 date-time format.

                                All date-time fields in responses must include the timezone. An example is below:

                                2017-04-05T10:43:07+00:00'
                              type: string
                              format: date-time
                            EndDateTime:
                              description: 'Date and time at which the offer ends.All dates in the JSON payloads are represented in ISO 8601 date-time format.

                                All date-time fields in responses must include the timezone. An example is below:

                                2017-04-05T10:43:07+00:00'
                              type: string
                              format: date-time
                            Rate:
                              description: Rate associated with the offer type.
                              type: string
                              pattern: ^(-?\d{1,3}){1}(\.\d{1,4}){0,1}$
                            Value:
                              description: Value associated with the offer type.
                              type: integer
                            Term:
                              description: Further details of the term of the offer.
                              type: string
                              minLength: 1
                              maxLength: 500
                            URL:
                              description: URL (Uniform Resource Locator) where documentation on the offer can be found
                              type: string
                              minLength: 1
                              maxLength: 256
                            Amount:
                              type: object
                              required:
                              - Amount
                              - Currency
                              description: Amount of money associated with the offer type.
                              properties:
                                Amount:
                                  description: A number of monetary units specified in an active currency where the unit of currency is explicit and compliant with ISO 4217.
                                  type: string
                                  pattern: ^\d{1,13}$|^\d{1,13}\.\d{1,5}$
                                Currency:
                                  description: A code allocated to a currency by a Maintenance Agency under an international identification scheme, as described in the latest edition of the international standard ISO 4217 "Codes for the representation of currencies and funds".
                                  type: string
                                  pattern: ^[A-Z]{3,3}$
                            Fee:
                              type: object
                              required:
                              - Amount
                              - Currency
                              description: Fee associated with the offer type.
                              properties:
                                Amount:
                                  description: A number of monetary units specified in an active currency where the unit of currency is explicit and compliant with ISO 4217.
                                  type: string
                                  pattern: ^\d{1,13}$|^\d{1,13}\.\d{1,5}$
                                Currency:
                                  description: A code allocated to a currency by a Maintenance Agency under an international identification scheme, as described in the latest edition of the international standard ISO 4217 "Codes for the representation of currencies and funds".
                                  type: string
                                  pattern: ^[A-Z]{3,3}$
