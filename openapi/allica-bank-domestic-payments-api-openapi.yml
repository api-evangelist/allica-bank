      security:
      - PSUOAuth2Security:
        - payments
  /domestic-payments/{DomesticPaymentId}:
    get:
      tags:
      - Domestic Payments
      summary: Get Domestic Payments
      operationId: GetDomesticPaymentsDomesticPaymentId
      parameters:
      - name: DomesticPaymentId
        in: path
        description: DomesticPaymentId
        required: true
        schema:
          type: string
      - in: header
        name: x-fapi-auth-date
        required: false
        description: 'The time when the PSU last logged in with the TPP.

          All dates in the HTTP headers are represented as RFC 7231 Full Dates. An example is below:

          Sun, 10 Sep 2017 19:43:31 UTC'
        schema:
          type: string
          pattern: ^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4} \d{2}:\d{2}:\d{2} (GMT|UTC)$
      - in: header
        name: x-fapi-customer-ip-address
        required: false
        description: The PSU's IP address if the PSU is currently logged in with the TPP.
        schema:
          type: string
      - in: header
        name: x-fapi-interaction-id
        required: false
        description: An RFC4122 UID used as a correlation id.
        schema:
          type: string
      - in: header
        name: Authorization
        required: true
        description: An Authorisation Token as per https://tools.ietf.org/html/rfc6750
        schema:
          type: string
      - in: header
        name: x-customer-user-agent
        description: Indicates the user-agent that the PSU is using.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Domestic Payments Read
          headers:
            x-fapi-interaction-id:
              description: An RFC4122 UID used as a correlation id.
              required: true
              schema:
                type: string
            x-jws-signature:
              description: 'Header containing a detached JWS signature of the body of the payload.

                '
              required: true
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                additionalProperties: false
                required:
                - Data
                properties:
                  Data:
                    type: object
                    additionalProperties: false
                    required:
                    - DomesticPaymentId
                    - ConsentId
                    - CreationDateTime
                    - Status
                    - StatusUpdateDateTime
                    - Initiation
                    properties:
                      DomesticPaymentId:
                        description: 'OB: Unique identification as assigned by the ASPSP to uniquely identify the domestic payment resource.'
                        type: string
                        minLength: 1
                        maxLength: 40
                      ConsentId:
                        description: 'OB: Unique identification as assigned by the ASPSP to uniquely identify the consent resource.'
                        type: string
                        minLength: 1
                        maxLength: 128
                      CreationDateTime:
                        description: 'Date and time at which the message was created.All dates in the JSON payloads are represented in ISO 8601 date-time format.

                          All date-time fields in responses must include the timezone. An example is below:

                          2017-04-05T10:43:07+00:00'
                        type: string
                        format: date-time
                      Status:
                        description: Specifies the status of the payment information group.
                        type: string
                        enum:
                        - AcceptedCreditSettlementCompleted
                        - AcceptedSettlementCompleted
                        - AcceptedSettlementInProcess
                        - AcceptedWithoutPosting
                        - Pending
                        - Rejected
                      StatusUpdateDateTime:
                        description: 'Date and time at which the resource status was updated.All dates in the JSON payloads are represented in ISO 8601 date-time format.

                          All date-time fields in responses must include the timezone. An example is below:

                          2017-04-05T10:43:07+00:00'
                        type: string
                        format: date-time
                      ExpectedExecutionDateTime:
                        description: 'Expected execution date and time for the payment resource.All dates in the JSON payloads are represented in ISO 8601 date-time format.

                          All date-time fields in responses must include the timezone. An example is below:

                          2017-04-05T10:43:07+00:00'
                        type: string
                        format: date-time
                      ExpectedSettlementDateTime:
                        description: 'Expected settlement date and time for the payment resource.All dates in the JSON payloads are represented in ISO 8601 date-time format.

                          All date-time fields in responses must include the timezone. An example is below:

                          2017-04-05T10:43:07+00:00'
                        type: string
                        format: date-time
                      Refund:
                        type: object
                        additionalProperties: false
                        required:
                        - Account
                        description: Unambiguous identification of the refund account to which a refund will be made as a result of the transaction.
                        properties:
                          Account:
                            type: object
                            additionalProperties: false
                            required:
                            - SchemeName
                            - Identification
                            - Name
                            description: Provides the details to identify an account.
                            properties:
                              SchemeName:
                                description: Name of the identification scheme, in a coded form as published in an external list.
                                type: string
                                x-namespaced-enum:
                                - UK.OBIE.BBAN
                                - UK.OBIE.IBAN
                                - UK.OBIE.PAN
                                - UK.OBIE.Paym
                                - UK.OBIE.SortCodeAccountNumber
                              Identification:
                                description: Identification assigned by an institution to identify an account. This identification is known by the account owner.
                                type: string
                                minLength: 1
                                maxLength: 256
                              Name:
                                description: 'Name of the account, as assigned by the account servicing institution.

                                  Usage: The account name is the name or names of the account owner(s) represented at an account level. The account name is not the product name or the nickname of the account.

                                  OB: ASPSPs may carry out name validation for Confirmation of Payee, but it is not mandatory.'
                                type: string
                                minLength: 1
                                maxLength: 350
                              SecondaryIdentification:
                                description: 'This is secondary identification of the account, as assigned by the account servicing institution.

                                  This can be used by building societies to additionally identify accounts with a roll number (in addition to a sort code and account number combination).'
                                type: string
                                minLength: 1
                                maxLength: 34
                      Charges:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          description: Set of elements used to provide details of a charge for the payment initiation.
                          required:
                          - ChargeBearer
                          - Type
                          - Amount
                          properties:
                            ChargeBearer:
                              description: Specifies which party/parties will bear the charges associated with the processing of the payment transaction.
                              type: string
                              enum:
                              - BorneByCreditor
                              - BorneByDebtor
                              - FollowingServiceLevel
                              - Shared
                            Type:
                              description: Charge type, in a coded form.
                              type: string
                              x-namespaced-enum:
                              - UK.OBIE.CHAPSOut
                            Amount:
                              type: object
                              additionalProperties: false
                              required:
                              - Amount
                              - Currency
                              description: Amount of money associated with the charge type.
                              properties:
                                Amount:
                                  description: A number of monetary units specified in an active currency where the unit of currency is explicit and compliant with ISO 4217.
                                  type: string
                                  pattern: ^\d{1,13}$|^\d{1,13}\.\d{1,5}$
                                Currency:
                                  description: A code allocated to a currency by a Maintenance Agency under an international identification scheme, as described in the latest edition of the international standard ISO 4217 "Codes for the representation of currencies and funds".
                                  type: string
                                  pattern: ^[A-Z]{3,3}$
                      Initiation:
                        type: object
                        additionalProperties: false
                        required:
                        - InstructionIdentification
                        - EndToEndIdentification
                        - InstructedAmount
                        - CreditorAccount
                        description: The Initiation payload is sent by the initiating party to the ASPSP. It is used to request movement of funds from the debtor account to a creditor for a single domestic payment.
                        properties:
                          InstructionIdentification:
                            description: 'Unique identification as assigned by an instructing party for an instructed party to unambiguously identify the instruction.

                              Usage: the  instruction identification is a point to point reference that can be used between the instructing party and the instructed party to refer to the individual instruction. It can be included in several messages related to the instruction.'
                            type: string
                            minLength: 1
                            maxLength: 35
                          EndToEndIdentification:
                            description: 'Unique identification assigned by the initiating party to unambiguously identify the transaction. This identification is passed on, unchanged, throughout the entire end-to-end chain.

                              Usage: The end-to-end identification can be used for reconciliation or to link tasks relating to the transaction. It can be included in several messages related to the transaction.

                              OB: The Faster Payments Scheme can only access 31 characters for the EndToEndIdentification field.'
                            type: string
                            minLength: 1
                            maxLength: 35
                          LocalInstrument:
                            description: 'User community specific instrument.

                              Usage: This element is used to specify a local instrument, local clearing option and/or further qualify the service or service level.'
