apis:
- aid: allica-bank:allica-bank-confirmation-of-funds-api
  name: Allica Bank Confirmation of Funds API
  description: >-
    Allica Bank's UK Open Banking Confirmation of Funds (CBPII) capability, exposed through the OBIE Read/Write
    Standard and the `fundsconfirmations` OAuth scope, allowing authorised Card-Based Payment Instrument
    Issuers and payment flows to confirm the availability of funds on Allica Business Rewards accounts.
    Documented on the Allica developer portal; FAPI-secured (OAuth2/OIDC, mTLS, PSD2 SCA) and not independently
    verified without OBIE onboarding.
  humanURL: https://developer.api.ob.allica.bank/
  baseURL: https://rs1.api.ob.allica.bank/open-banking/v3.1/cbpii
  tags:
  - Confirmation of Funds
  - CBPII
  - Open Banking
  - OBIE
  properties:
  - type: Documentation
    url: https://developer.api.ob.allica.bank/perry/developer/welcome
  - type: APIReference
    url: >-
      https://developer.api.ob.allica.bank/perry/developer/documentation?resource=ukhub-allica-portal&document=swagger/payment-initiation-openapi.yaml
- aid: allica-bank:allica-bank-dynamic-client-registration-api
  name: Allica Bank Dynamic Client Registration API
  description: >-
    OBIE Dynamic Client Registration (DCR) v3.2 endpoint used by regulated Third Party Providers to register
    OAuth clients with Allica Bank using Software Statement Assertions issued by the Open Banking Directory.
    Confirmed as the registration_endpoint in Allica's production OIDC discovery document.
  humanURL: https://developer.api.ob.allica.bank/
  baseURL: https://rs1.api.ob.allica.bank/dynamic-client-registration/v3.2/register
  tags:
  - Dynamic Client Registration
  - DCR
  - Onboarding
  - OBIE
