aid: allica-bank
url: https://raw.githubusercontent.com/api-evangelist/allica-bank/refs/heads/main/apis.yml
name: Allica Bank
kind: company
description: Allica Bank Limited is a UK financial-technology bank built specifically
  for established small and medium-sized businesses, offering business current accounts,
  savings, commercial mortgages, asset finance, and invoice finance. It is a privately
  owned, venture-backed challenger bank (not a mutual or building society), authorised
  by the Prudential Regulation Authority and regulated by the Financial Conduct Authority
  and PRA (FRN 821851), registered in England and Wales (company number 07706156).
  As an FCA-authorised ASPSP it participates in UK Open Banking under the Open Banking
  Implementation Entity (OBIE) Read/Write Standard and PSD2 - it is not one of the
  nine CMA9 mandated banks, but publishes a public developer portal exposing Account
  and Transaction Information (AIS), Payment Initiation (PIS), and Confirmation of
  Funds (fundsconfirmations) APIs for its Business Rewards accounts. Access is secured
  with FAPI-grade OAuth2/OIDC, PSD2 strong customer authentication, mutual-TLS client
  authentication, and dynamic client registration using Open Banking Directory /
  eIDAS certificates and Software Statement Assertions.
